[versions]
# ⚠ 这个 kotlin 版本号只管到 Compose 编译器插件（下面 kotlin-compose 引它）。
# 仓库里没有 apply `org.jetbrains.kotlin.android` —— Kotlin Gradle 插件是 AGP 带进来的，
# 所以「必须与 KGP 严格一致」这条约束在本项目里不是由这里保证的。
# AGP 自己期望的是另一个版本（见 app/build.gradle.kts 里 compose-group-mapping 的 force），
# 两边对不上时以能编译为准。
# 所以这个版本号只钉住 Compose 编译器插件本身，并不约束 KGP —— 别把它当 Kotlin 版本看。改 AGP 时
# 要另看这个插件版本还配不配（build.gradle.kts 里那段 force 就是为这个）。
kotlin = "2.4.20"
composeBom = "2026.09.00"
# ⚠ 不能用 BOM 托管 material3：MD3E 的公开 API（MaterialExpressiveTheme /
# MotionScheme.expressive）在稳定版里还是 internal，只有 1.5.0-alpha 起才对外公开。
# 显式写版本即可覆盖 BOM（Gradle 里显式声明优先于 platform）。
material3 = "1.5.0-alpha28"
activityCompose = "1.13.0"
coreKtx = "1.17.0"

[libraries]
libxposed-api = { module = "io.github.libxposed:api", version = "102.0.0" }

# UI：Material 3 Expressive（Compose）。各库版本统一交给 BOM 托管，避免互相打架。
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
# Material Icons Extended：作用域/状态/验证等卡片左侧的小图标（Power、Android、Layers 等）
# 标准 material-icons 没有这些语义图标；extended 多 ~7k 个图标，仅 ~20KB gzip 增量。
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
# 通知侧要在 SystemUI 进程里读 ContentProvider、跑 MatrixCursor，用 KTX 的便利方法更省事
core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
# MaterialShapes：Material 3 Expressive 的形状系统（连续圆角多边形，如花瓣/曲奇）

[plugins]
android-application = { id = "com.android.application", version = "9.4.1" }
# Compose 编译器插件的版本钉在这里；**它不是 Kotlin Gradle 插件的版本**（上面第 2~8 行那段
# 说的就是这件事：KGP 由 AGP 带进来，"必须严格一致"这条约束不由本文件保证）。
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
